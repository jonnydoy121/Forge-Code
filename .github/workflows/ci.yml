name: ci
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build:sidecar
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: cargo test
        shell: bash
        run: |
          set +e
          cargo test --workspace 2>&1 | tee cargo-test.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            # Public annotations carry the failure summary (job logs need authentication to read).
            msg=$(grep -E "^error|panicked|FAILED|failed|^---- " cargo-test.log | head -c 3500 | paste -sd '|' -)
            echo "::error title=cargo test failed::$msg"
          fi
          exit $code
      - name: rustfmt and clippy
        shell: bash
        run: |
          set +e
          cargo fmt --all -- --check > lint-rust.log 2>&1
          fmt=$?
          cargo clippy --workspace --all-targets -- -D warnings >> lint-rust.log 2>&1
          clippy=$?
          if [ "$fmt" != "0" ] || [ "$clippy" != "0" ]; then
            # Public annotations carry the summary (job logs need authentication to read).
            msg=$(grep -E "^(error|warning)|^Diff in|-->" lint-rust.log | head -c 3500 | paste -sd '|' -)
            echo "::error title=rustfmt or clippy failed::$msg"
            exit 1
          fi
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/desktop
      - run: npm run e2e
